name: Update visitor stats

on:
  schedule:
    # every hour, at the top
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch GitHub traffic and write data file
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/fetch-traffic.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visitor-stats.json
          if git diff --cached --quiet; then
            echo "No change in visitor stats."
          else
            git commit -m "chore: update visitor stats"
            git push
          fi
